<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partidos del Día</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="partidos-container">
    <h1 class="page-title">📅 Partidos de Hoy</h1>
    <div id="partidos-container">
      <div class="empty-state">⏳ Cargando partidos...</div>
    </div>
    <div style="text-align:center; margin-top:1.2rem;">
      <a href="/inicio" class="btn-back">← Volver</a>
    </div>
  </div>

  <script>
    async function cargarPartidos() {
      const container = document.getElementById("partidos-container");
      try {
        const hoy = new Date().toISOString().split("T")[0];
        const res = await fetch(
          `/proxy/api-football?path=${encodeURIComponent("/fixtures?date=" + hoy)}`
        );
        const data = await res.json();
        const partidos = data.response || [];

        if (partidos.length === 0) {
          container.innerHTML = '<div class="empty-state">😴 No hay partidos programados para hoy.</div>';
          return;
        }

        let html = "";
        partidos.forEach(p => {
          const hora = new Date(p.fixture.date).toLocaleTimeString("es", {hour:"2-digit", minute:"2-digit"});
          const liga = p.league.name;
          const home = p.teams.home.name;
          const away = p.teams.away.name;
          const estado = p.fixture.status.short;
          const golesH = p.goals.home !== null ? p.goals.home : "-";
          const golesA = p.goals.away !== null ? p.goals.away : "-";
          const isLive = ["1H","HT","2H","ET","P"].includes(estado);

          html += `
          <div class="partido-card">
            <div>
              <div class="partido-teams">${home} <span style="color:#aaa;font-weight:400">vs</span> ${away}</div>
              <div class="partido-meta">${liga} · ${hora}${isLive ? ' · <span style="color:#16a34a;font-weight:600">EN VIVO</span>' : ''}</div>
            </div>
            <div class="partido-score">${golesH} - ${golesA}</div>
          </div>`;
        });
        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = '<div class="empty-state">❌ No se pudieron cargar los partidos.</div>';
      }
    }
    cargarPartidos();
  </script>
</body>
</html>
