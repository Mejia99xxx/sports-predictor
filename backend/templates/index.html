<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pronosticador de Fútbol</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    <div class="card-header">
      <div class="logo">⚽</div>
      <h1>Pronosticador de Fútbol</h1>
      <p class="subtitle">Predicciones basadas en estadísticas reales</p>
    </div>

    <div class="card-body">
      <div id="liga-error" class="error-msg"></div>
      <div id="team-error" class="error-msg"></div>
      <div id="info-msg" class="info-msg"></div>

      <form id="predict-form">
        <input type="hidden" name="local_team_name" id="local_team_name" value="">
        <input type="hidden" name="visitante_team_name" id="visitante_team_name" value="">

        <div class="form-group">
          <label for="liga_id">🏆 Liga / Competición</label>
          <select id="liga_id" name="liga_id" disabled>
            <option value="">Cargando ligas...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="local_team_id">🏠 Equipo Local</label>
          <select id="local_team_id" name="local_team_id" disabled>
            <option value="">— Selecciona una liga primero —</option>
          </select>
        </div>

        <div class="vs-divider">VS</div>

        <div class="form-group">
          <label for="visitante_team_id">✈️ Equipo Visitante</label>
          <select id="visitante_team_id" name="visitante_team_id" disabled>
            <option value="">— Selecciona una liga primero —</option>
          </select>
        </div>

        <button type="submit" class="btn-predict">⚡ Predecir resultado</button>
      </form>

      <a class="nav-link" href="/partidos">📅 Ver partidos del día</a>
    </div>
  </div>

  <div id="result-overlay" style="display:none; position:fixed; inset:0; background:linear-gradient(135deg,#0f2027,#203a43,#2c5364); display:none; align-items:center; justify-content:center; padding:1.5rem;">
    <div class="container">
      <div class="card-header">
        <div class="logo">⚽</div>
        <h1>Pronosticador de Fútbol</h1>
      </div>
      <div id="result-content" class="result-card"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
